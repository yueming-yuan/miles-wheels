name: Build router rolling assets
on:
  push:
    branches: [jiajun/router-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # Router integration tests at the built ref and at its base, so failures the ref
    # introduces are told apart from ones its base already has.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '4'
      HEAD_REF: 36c4d142792b430b954385e909a16ffa0a6abdcd
      BASE_REF: 374ff283397254d1a3c9577058d7089bcb91a7b1
    steps:
      - name: cargo test spec_test and routing_tests
        shell: bash
        run: |
          # GitHub's bash runs with -e; test failures must not stop the base run.
          set +e -uo pipefail
          mkdir -p logs
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev pkg-config libssl-dev cmake clang libclang-dev redis-server
          git clone -q https://github.com/radixark/sgl-router-for-miles.git router || exit 1
          cargo --version
          for ref in "$HEAD_REF" "$BASE_REF"; do
            git -C router checkout -q --detach "$ref"
            (cd router && cargo test --test spec_test --test routing_tests --no-fail-fast) > "logs/cargo-test-${ref:0:10}.log" 2>&1
            echo "$ref exit=$?" | tee -a logs/summary.txt
            grep -E '^test result:|^test .* FAILED$' "logs/cargo-test-${ref:0:10}.log" | tee -a logs/summary.txt
            grep -E '^test .* FAILED$' "logs/cargo-test-${ref:0:10}.log" | sort > "logs/failed-${ref:0:10}.txt"
          done
          comm -23 "logs/failed-${HEAD_REF:0:10}.txt" "logs/failed-${BASE_REF:0:10}.txt" > logs/new-failures.txt
          echo "new failures at head:"; cat logs/new-failures.txt
          grep -q '^test result' "logs/cargo-test-${HEAD_REF:0:10}.log" && grep -q '^test result' "logs/cargo-test-${BASE_REF:0:10}.log" && [ ! -s logs/new-failures.txt ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: router-tests
          path: logs/
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '4'
      WHEEL_DIR: /tmp/router-wheels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          {
            df -h /tmp
            free -h
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler libprotobuf-dev pkg-config libssl-dev cmake clang libclang-dev
            python -m pip install maturin==1.14.0 aiohttp packaging
            python build_wheels.py build --cuda 130 --arch ${{ matrix.arch }} --only sgl-router --router-ref 36c4d142792b430b954385e909a16ffa0a6abdcd
            python -m pip install /tmp/router-wheels/sglang_router-*.whl
            mkdir -p /tmp/router-bin
            tar xzf /tmp/router-wheels/sgl-model-gateway-*.tar.gz -C /tmp/router-bin
            python check_router_forwarding.py --log-dir logs
            python check_router_forwarding.py --log-dir logs --router-bin /tmp/router-bin/sgl-model-gateway
            sha256sum /tmp/router-wheels/*
          } 2>&1 | tee logs/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: router-${{ matrix.arch }}
          path: |
            /tmp/router-wheels/
            logs/
